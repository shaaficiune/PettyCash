services:
  - type: web
    name: petty-cash-backend
    env: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:init && npx prisma db seed && npm run start:prod
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: INITIAL_ACCOUNTANT_PASSWORD
        generateValue: true
      - key: INITIAL_EMPLOYEE_PASSWORD
        generateValue: true
      - key: INITIAL_BLUEKOM_EMPLOYEE_PASSWORD
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://petty-cash-frontend.onrender.com

  - type: web
    name: petty-cash-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://petty-cash-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
